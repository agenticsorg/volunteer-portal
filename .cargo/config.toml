# ADR-0011: ts-rs generates TypeScript bindings from Rust request/response
# types into the frontend's source tree, workspace-root-relative
# regardless of which crate defines a given #[derive(TS)] type, so
# `#[ts(export_to = "...")]` attributes can stay simple filenames.
[env]
TS_RS_EXPORT_DIR = { value = "apps/web/src/generated", relative = true }
