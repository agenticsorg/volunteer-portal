[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/identity-access",
    "crates/projects-assignments",
    "crates/hours-verification",
    "crates/discord-integration",
    "crates/notifications",
    "crates/compliance-audit",
    "apps/api",
    "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
kernel = { path = "crates/kernel" }
identity-access = { path = "crates/identity-access" }
projects-assignments = { path = "crates/projects-assignments" }
hours-verification = { path = "crates/hours-verification" }
discord-integration = { path = "crates/discord-integration" }
notifications = { path = "crates/notifications" }
compliance-audit = { path = "crates/compliance-audit" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
