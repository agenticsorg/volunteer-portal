name: CI

# Required status checks on PRs into main (ADR-0015). Phase 1 (Event
# Backbone & Platform Audit Log) adds this repo's first real domain
# behavior — admin.audit_log, the transactional outbox, and the
# graphile-worker audit_log_writer consumer — so `test-integration` now
# runs the compliance-critical audit-log integration suite (via
# testcontainers, see apps/web/tests/integration/setup.ts) as a required
# check alongside lint, typecheck, unit tests, e2e-smoke, and the Prisma
# migration dry-run against a disposable shadow database. The contract-test
# job (OpenAPI-response validation) still lands once `/api/v1` exists.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.32.1"
  # Node 20 cannot run @testcontainers/postgresql (undici@8.10.0's webidl
  # cache module requires globals Node 20's built-in fetch doesn't expose:
  # `TypeError: webidl.util.markAsUncloneable is not a function`), so
  # test-integration needs Node 22+.
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint (includes module-boundary rule, ADR-0001)
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit across the workspace
        run: pnpm typecheck

  test-unit:
    name: "test:unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest unit project
        run: pnpm test:unit

  test-integration:
    name: "test:integration"
    runs-on: ubuntu-latest
    # No `services:` Postgres block here (unlike prisma-migrate-dry-run
    # below): the "integration" Vitest project's globalSetup
    # (apps/web/tests/integration/setup.ts) uses `@testcontainers/postgresql`
    # to start its own disposable postgres:16 container per run, per
    # ADR-0015. GitHub-hosted ubuntu-latest runners have a Docker daemon
    # available at the default /var/run/docker.sock with no extra
    # DOCKER_HOST/dind configuration required — testcontainers talks to it
    # directly, the same as it does on a developer machine.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest integration project (testcontainers Postgres 16 + graphile-worker, ADR-0015)
        run: pnpm test:integration

  e2e-smoke:
    name: "e2e:smoke"
    runs-on: ubuntu-latest
    env:
      # proxy.ts (Phase 2's Supabase session-refresh middleware) runs on
      # every route per its matcher, including "/" and "/api/v1/health", so
      # the app 500s on every request without these set — even though this
      # phase has no protected routes and the smoke suite never logs in.
      # Like the integration suite (see
      # tests/integration/supabaseSignup.integration.test.ts), CI never runs
      # `supabase start`: with no session cookie on the request,
      # getVerifiedSession()'s supabase.auth.getClaims() resolves to "no
      # session" without ever reaching this URL, so a syntactically-valid
      # placeholder is enough — it only needs to make getSupabaseAuthEnv()'s
      # presence check pass.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright smoke suite (builds and starts the app itself)
        run: pnpm e2e:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  prisma-migrate-dry-run:
    name: "prisma:migrate-dry-run"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shadow:shadow@localhost:5432/shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply every migration to a fresh disposable shadow database
        run: pnpm --filter web exec prisma migrate deploy
      - name: Verify all eight bounded-context schemas were created
        run: |
          # psql's URI parser doesn't understand Prisma's `?schema=` query
          # parameter (it's a Prisma-only extension, not real libpq syntax),
          # so strip it before handing DATABASE_URL to psql.
          psql_url="${DATABASE_URL%%\?*}"
          missing=0
          for schema in identity volunteering training gamification community moderation notifications admin; do
            found=$(psql "$psql_url" -tAc "SELECT 1 FROM information_schema.schemata WHERE schema_name = '${schema}'")
            if [ "$found" != "1" ]; then
              echo "::error::Missing expected schema: ${schema}"
              missing=1
            fi
          done
          exit $missing
