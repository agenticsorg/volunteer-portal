<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background-color:#faf8f3;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="background-color:#faf8f3;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" style="background-color:#1a2a3a;border-radius:8px;overflow:hidden;">
        <tr><td style="padding:24px;">
          <p style="color:#5cb8e8;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px 0;">Agentics Foundation</p>
          <h1 style="color:#ffffff;font-size:20px;margin:0 0 16px 0;">Hours approved, {{ name }}</h1>
          <p style="color:#ffffff;font-size:14px;line-height:1.5;margin:0 0 16px 0;">
            Your logged hours have been approved: <strong>{{ hours }} hours</strong> on {{ date }}. Thank you for your contribution.
          </p>
          <a href="#" style="display:inline-block;padding:10px 20px;background-color:#ff5a1f;color:#ffffff;text-decoration:none;border-radius:4px;font-size:14px;">View your hours</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
