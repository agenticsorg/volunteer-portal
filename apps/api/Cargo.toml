[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kernel = { workspace = true }
identity-access = { workspace = true }
projects-assignments = { workspace = true }
hours-verification = { workspace = true }
discord-integration = { workspace = true }
notifications = { workspace = true }
compliance-audit = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid.workspace = true
async-trait.workspace = true
tower-sessions-sqlx-store-chrono = { version = "0.14.2", features = ["postgres"] }
tower-sessions = "0.14"
oauth2 = "5.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
time = "0.3.55"
thiserror.workspace = true
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde_json", "uuid-impl"] }
openidconnect = "4.0.1"
chrono.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
typst = { workspace = true }
typst-layout = { workspace = true }
typst-as-lib = { workspace = true }
typst-pdf = { workspace = true }
typst-assets = { workspace = true }
# ADR-0010 (Prompt 7.1): compile-time-checked email templates, and the
# Postmark (hand-rolled reqwest client, no official Rust SDK) / Resend
# (official SDK, the documented fallback) providers behind
# `notifications::EmailProvider`.
askama = "0.16.0"
resend-rs = { version = "0.30.2", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
chrono.workspace = true
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { workspace = true, features = ["util"] }
# Verifies the rendered verification letter's content (approved-only
# rollup, brand copy) by extracting real text from the PDF bytes
# (Prompt 6.1) -- not from the Typst source, from the actual compiled
# output.
pdf-extract = "0.12"
# Stands in for the real Postmark/Resend HTTP APIs in Prompt 7.1's
# integration tests -- no live provider account/credentials exist in
# this environment (matching Prompt 5.1's `reconcile_discord_roles.rs`
# precedent for a real-but-credential-blocked integration), so this
# verifies the actual HTTP request/response contract against a mock
# server rather than only unit-testing template rendering in isolation.
wiremock = "0.6"
